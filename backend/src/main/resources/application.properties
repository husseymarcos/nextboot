spring.application.name=nextboot
spring.main.lazy-initialization=true
spring.datasource.url=jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=require&connectTimeout=5&socketTimeout=60
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
# ponytail: 10s fail-fast + recycle before serverless pg kills idle conns
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.sql.init.mode=always
server.port=${PORT:8080}
# virtual threads (Java 21): cheap concurrency on a small container
spring.threads.virtual.enabled=true
# respect X-Forwarded-* from Vercel edge
server.forward-headers-strategy=framework
server.tomcat.threads.max=20
